<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 780" width="1120" height="780" role="img" aria-labelledby="t d"><title id="t">Local model: WebGPU / Wasm on your machine, weights from a static CDN</title><desc id="d">Inference runs in a Webview (the only place VS Code exposes WebGPU). The CDN only serves files; prompts never leave the machine.</desc><defs><marker id="ah-9ca3af" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#9ca3af"/></marker></defs><rect x="0.0" y="0.0" width="1120.0" height="780.0" rx="14" fill="#0d1117" fill-opacity="1" stroke="#30363d" stroke-opacity="1" stroke-width="1"/><rect x="0.0" y="0.0" width="1120.0" height="4.0" rx="0" fill="#00e5a0" fill-opacity="1" stroke="none" stroke-opacity="1" stroke-width="1"/><text x="40.0" y="40.0" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="11" font-weight="700" fill="#00e5a0" fill-opacity="1" text-anchor="start" letter-spacing="1.6">PROCESS DESIGN · LOCAL ENGINE</text><text x="40.0" y="70.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="700" fill="#e6edf3" fill-opacity="1" text-anchor="start">Local model: WebGPU / Wasm on your machine, weights from a static CDN</text><text x="40.0" y="94.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#9ca3af" fill-opacity="1" text-anchor="start">Inference runs in a Webview (the only place VS Code exposes WebGPU). The CDN only serves files; prompts never leave the machine.</text><rect x="40.0" y="122.0" width="320.0" height="150.0" rx="8" fill="#00e5a0" fill-opacity="0.07" stroke="#00e5a0" stroke-opacity="0.55" stroke-width="1.2"/><rect x="40.0" y="128.0" width="3.0" height="138.0" rx="1.5" fill="#00e5a0" fill-opacity="1" stroke="none" stroke-opacity="1" stroke-width="1"/><text x="56.0" y="146.3" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#e6edf3" fill-opacity="1" text-anchor="start">Extension host (Node)</text><text x="56.0" y="167.5" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#9ca3af" fill-opacity="1" text-anchor="start">alpaquitay-ai.generateSpecLocal ·</text><text x="56.0" y="183.8" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#9ca3af" fill-opacity="1" text-anchor="start">LocalGemmaProvider (opt-in "local-wasm"). Asks</text><text x="56.0" y="200.1" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#9ca3af" fill-opacity="1" text-anchor="start">before any download, shows progress, writes</text><text x="56.0" y="216.5" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#9ca3af" fill-opacity="1" text-anchor="start">specs/&lt;slug&gt;.md in spec.md format.</text><rect x="400.0" y="122.0" width="320.0" height="150.0" rx="8" fill="#3b82f6" fill-opacity="0.07" stroke="#3b82f6" stroke-opacity="0.55" stroke-width="1.2"/><rect x="400.0" y="128.0" width="3.0" height="138.0" rx="1.5" fill="#3b82f6" fill-opacity="1" stroke="none" stroke-opacity="1" stroke-width="1"/><text x="416.0" y="146.3" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#e6edf3" fill-opacity="1" text-anchor="start">Webview (Chromium)</text><text x="416.0" y="167.5" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#9ca3af" fill-opacity="1" text-anchor="start">GemmaWasmEngine singleton · transformers.js +</text><text x="416.0" y="183.8" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#9ca3af" fill-opacity="1" text-anchor="start">onnxruntime-web. CSP: connect-src is the CDN</text><text x="416.0" y="200.1" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#9ca3af" fill-opacity="1" text-anchor="start">origin only. Picks WebGPU if an adapter exists,</text><text x="416.0" y="216.5" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#9ca3af" fill-opacity="1" text-anchor="start">else Wasm.</text><rect x="760.0" y="122.0" width="320.0" height="150.0" rx="8" fill="#f59e0b" fill-opacity="0.07" stroke="#f59e0b" stroke-opacity="0.55" stroke-width="1.2"/><rect x="760.0" y="128.0" width="3.0" height="138.0" rx="1.5" fill="#f59e0b" fill-opacity="1" stroke="none" stroke-opacity="1" stroke-width="1"/><text x="776.0" y="146.3" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#e6edf3" fill-opacity="1" text-anchor="start">alpaquitay.specsolid.com</text><text x="776.0" y="167.5" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#9ca3af" fill-opacity="1" text-anchor="start">Cloudflare Worker: CORS allow-list · COEP / CORP ·</text><text x="776.0" y="183.8" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#9ca3af" fill-opacity="1" text-anchor="start">strict MIME (.wasm .onnx .json) · Range + ETag.</text><text x="776.0" y="200.1" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#9ca3af" fill-opacity="1" text-anchor="start">R2 bucket behind it, $0 compute per inference.</text><path d="M360.0,177.0 L400.0,177.0" fill="none" stroke="#9ca3af" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah-9ca3af)"/><rect x="350.2" y="168.0" width="59.6" height="18.0" rx="9" fill="#0d1117" fill-opacity="1" stroke="#30363d" stroke-opacity="1" stroke-width="1"/><text x="380.0" y="181.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#9ca3af" fill-opacity="1" text-anchor="middle">generate</text><path d="M400.0,227.0 L360.0,227.0" fill="none" stroke="#9ca3af" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah-9ca3af)"/><rect x="333.2" y="218.0" width="93.5" height="18.0" rx="9" fill="#0d1117" fill-opacity="1" stroke="#30363d" stroke-opacity="1" stroke-width="1"/><text x="380.0" y="231.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#9ca3af" fill-opacity="1" text-anchor="middle">progress · done</text><path d="M720.0,177.0 L760.0,177.0" fill="none" stroke="#9ca3af" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah-9ca3af)"/><rect x="708.5" y="168.0" width="63.0" height="18.0" rx="9" fill="#0d1117" fill-opacity="1" stroke="#30363d" stroke-opacity="1" stroke-width="1"/><text x="740.0" y="181.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#9ca3af" fill-opacity="1" text-anchor="middle">MISS only</text><path d="M760.0,227.0 L720.0,227.0" fill="none" stroke="#9ca3af" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah-9ca3af)"/><rect x="715.6" y="218.0" width="48.8" height="18.0" rx="9" fill="#0d1117" fill-opacity="1" stroke="#30363d" stroke-opacity="1" stroke-width="1"/><text x="740.0" y="231.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#9ca3af" fill-opacity="1" text-anchor="middle">stream</text><rect x="400.0" y="340.0" width="320.0" height="140.0" rx="8" fill="#a78bfa" fill-opacity="0.07" stroke="#a78bfa" stroke-opacity="0.55" stroke-width="1.2"/><rect x="400.0" y="346.0" width="3.0" height="128.0" rx="1.5" fill="#a78bfa" fill-opacity="1" stroke="none" stroke-opacity="1" stroke-width="1"/><text x="416.0" y="364.4" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#e6edf3" fill-opacity="1" text-anchor="start">IndexedDB cache</text><text x="416.0" y="385.5" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#9ca3af" fill-opacity="1" text-anchor="start">Files stored in 8 MB chunks, served back as a lazy</text><text x="416.0" y="401.8" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#9ca3af" fill-opacity="1" text-anchor="start">stream. The meta record is written last, so a half</text><text x="416.0" y="418.1" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#9ca3af" fill-opacity="1" text-anchor="start">download is never used. manifest.json revision</text><text x="416.0" y="434.5" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#9ca3af" fill-opacity="1" text-anchor="start">invalidates old weights.</text><rect x="400.0" y="540.0" width="320.0" height="96.0" rx="8" fill="#f472b6" fill-opacity="0.07" stroke="#f472b6" stroke-opacity="0.55" stroke-width="1.2"/><rect x="400.0" y="546.0" width="3.0" height="84.0" rx="1.5" fill="#f472b6" fill-opacity="1" stroke="none" stroke-opacity="1" stroke-width="1"/><text x="416.0" y="564.4" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#e6edf3" fill-opacity="1" text-anchor="start">Local GPU / CPU</text><text x="416.0" y="585.5" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#9ca3af" fill-opacity="1" text-anchor="start">WebGPU (JSEP build) or Wasm (single thread in a</text><text x="416.0" y="601.8" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#9ca3af" fill-opacity="1" text-anchor="start">Webview). q4 ONNX weights.</text><rect x="760.0" y="340.0" width="320.0" height="140.0" rx="8" fill="#22d3ee" fill-opacity="0.07" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="1.2"/><rect x="760.0" y="346.0" width="3.0" height="128.0" rx="1.5" fill="#22d3ee" fill-opacity="1" stroke="none" stroke-opacity="1" stroke-width="1"/><text x="776.0" y="364.4" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#e6edf3" fill-opacity="1" text-anchor="start">What the CDN serves</text><text x="776.0" y="384.1" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="10" font-weight="400" fill="#9ca3af" fill-opacity="1" text-anchor="start">/models/&lt;id&gt;/manifest.json</text><text x="776.0" y="398.3" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="10" font-weight="400" fill="#9ca3af" fill-opacity="1" text-anchor="start">/models/&lt;id&gt;/onnx/model_q4.onnx</text><text x="776.0" y="412.5" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="10" font-weight="400" fill="#9ca3af" fill-opacity="1" text-anchor="start">/models/runtime/&lt;ort&gt;/ort-wasm-*.{mjs,wasm}</text><path d="M560.0,272.0 L560.0,340.0" fill="none" stroke="#9ca3af" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah-9ca3af)"/><rect x="523.6" y="297.0" width="72.9" height="18.0" rx="9" fill="#0d1117" fill-opacity="1" stroke="#30363d" stroke-opacity="1" stroke-width="1"/><text x="560.0" y="310.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#9ca3af" fill-opacity="1" text-anchor="middle">match / put</text><path d="M560.0,480.0 L560.0,540.0" fill="none" stroke="#9ca3af" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah-9ca3af)"/><path d="M920.0,272.0 L920.0,340.0" fill="none" stroke="#9ca3af" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah-9ca3af)"/><rect x="40.0" y="340.0" width="320.0" height="100.0" rx="8" fill="#f59e0b" fill-opacity="0.07" stroke="#f59e0b" stroke-opacity="0.55" stroke-width="1.2"/><rect x="40.0" y="346.0" width="3.0" height="88.0" rx="1.5" fill="#f59e0b" fill-opacity="1" stroke="none" stroke-opacity="1" stroke-width="1"/><text x="56.0" y="364.4" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#e6edf3" fill-opacity="1" text-anchor="start">First run</text><text x="56.0" y="385.5" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#9ca3af" fill-opacity="1" text-anchor="start">probe → size from manifest → confirm download →</text><text x="56.0" y="401.8" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#9ca3af" fill-opacity="1" text-anchor="start">fetch → store → load → generate.</text><rect x="40.0" y="456.0" width="320.0" height="100.0" rx="8" fill="#00e5a0" fill-opacity="0.07" stroke="#00e5a0" stroke-opacity="0.55" stroke-width="1.2"/><rect x="40.0" y="462.0" width="3.0" height="88.0" rx="1.5" fill="#00e5a0" fill-opacity="1" stroke="none" stroke-opacity="1" stroke-width="1"/><text x="56.0" y="480.4" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#e6edf3" fill-opacity="1" text-anchor="start">Next runs</text><text x="56.0" y="501.5" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#9ca3af" fill-opacity="1" text-anchor="start">Cache HIT: no network needed for weights. Offline</text><text x="56.0" y="517.8" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#9ca3af" fill-opacity="1" text-anchor="start">works if the model was already cached.</text><path d="M200.0,440.0 L200.0,456.0" fill="none" stroke="#9ca3af" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah-9ca3af)"/><text x="40.0" y="700.0" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="12" font-weight="400" fill="#00e5a0" fill-opacity="1" text-anchor="start">Privacy:   the prompt and the answer stay in the Webview; the CDN only ever sees GET requests for static files.</text><text x="40.0" y="724.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#9ca3af" fill-opacity="1" text-anchor="start">Settings: alpaquitay-ai.localEngine.{enabled, cdnBaseUrl, modelId, device, maxNewTokens}. Clear the cache with “Clear Local Model Cache”.</text><rect x="40.0" y="747.0" width="12.0" height="12.0" rx="3" fill="#00e5a0" fill-opacity="0.25" stroke="#00e5a0" stroke-opacity="0.9" stroke-width="1"/><text x="58.0" y="757.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#9ca3af" fill-opacity="1" text-anchor="start">Extension host</text><rect x="165.2" y="747.0" width="12.0" height="12.0" rx="3" fill="#3b82f6" fill-opacity="0.25" stroke="#3b82f6" stroke-opacity="0.9" stroke-width="1"/><text x="183.2" y="757.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#9ca3af" fill-opacity="1" text-anchor="start">Webview engine</text><rect x="299.6" y="747.0" width="12.0" height="12.0" rx="3" fill="#f59e0b" fill-opacity="0.25" stroke="#f59e0b" stroke-opacity="0.9" stroke-width="1"/><text x="317.6" y="757.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#9ca3af" fill-opacity="1" text-anchor="start">CDN</text><rect x="368.0" y="747.0" width="12.0" height="12.0" rx="3" fill="#a78bfa" fill-opacity="0.25" stroke="#a78bfa" stroke-opacity="0.9" stroke-width="1"/><text x="386.0" y="757.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#9ca3af" fill-opacity="1" text-anchor="start">Cache</text><rect x="446.2" y="747.0" width="12.0" height="12.0" rx="3" fill="#f472b6" fill-opacity="0.25" stroke="#f472b6" stroke-opacity="0.9" stroke-width="1"/><text x="464.2" y="757.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#9ca3af" fill-opacity="1" text-anchor="start">Hardware</text><text x="1080" y="764" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#6b7280" text-anchor="end">Alpaquitay AI · github.com/sergioide007/alpaquitay-ai</text></svg>