<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 820" width="1120" height="820" role="img" aria-labelledby="t d"><title id="t">Architecture inference: from evidence to diagram to infrastructure code</title><desc id="d">The canvas draws the system itself, not just epic titles. Manual edits always win; Re-infer rebuilds from current evidence.</desc><defs><marker id="ah-9ca3af" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#9ca3af"/></marker></defs><rect x="0.0" y="0.0" width="1120.0" height="820.0" rx="14" fill="#0d1117" fill-opacity="1" stroke="#30363d" stroke-opacity="1" stroke-width="1"/><rect x="0.0" y="0.0" width="1120.0" height="4.0" rx="0" fill="#00e5a0" fill-opacity="1" stroke="none" stroke-opacity="1" stroke-width="1"/><text x="40.0" y="40.0" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="11" font-weight="700" fill="#00e5a0" fill-opacity="1" text-anchor="start" letter-spacing="1.6">PROCESS DESIGN · ARCH TAB</text><text x="40.0" y="70.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="700" fill="#e6edf3" fill-opacity="1" text-anchor="start">Architecture inference: from evidence to diagram to infrastructure code</text><text x="40.0" y="94.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#9ca3af" fill-opacity="1" text-anchor="start">The canvas draws the system itself, not just epic titles. Manual edits always win; Re-infer rebuilds from current evidence.</text><rect x="40.0" y="122.0" width="336.0" height="118.0" rx="8" fill="#3b82f6" fill-opacity="0.07" stroke="#3b82f6" stroke-opacity="0.55" stroke-width="1.2"/><rect x="40.0" y="128.0" width="3.0" height="106.0" rx="1.5" fill="#3b82f6" fill-opacity="1" stroke="none" stroke-opacity="1" stroke-width="1"/><text x="56.0" y="146.3" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#e6edf3" fill-opacity="1" text-anchor="start">Workspace manifests</text><text x="56.0" y="167.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#9ca3af" fill-opacity="1" text-anchor="start">package.json (root + monorepo), requirements.txt,</text><text x="56.0" y="182.6" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#9ca3af" fill-opacity="1" text-anchor="start">pyproject, pom.xml, build.gradle, go.mod, composer,</text><text x="56.0" y="198.3" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#9ca3af" fill-opacity="1" text-anchor="start">Gemfile, *.csproj, serverless.yml → real stack</text><rect x="392.0" y="122.0" width="336.0" height="118.0" rx="8" fill="#22d3ee" fill-opacity="0.07" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="1.2"/><rect x="392.0" y="128.0" width="3.0" height="106.0" rx="1.5" fill="#22d3ee" fill-opacity="1" stroke="none" stroke-opacity="1" stroke-width="1"/><text x="408.0" y="146.3" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#e6edf3" fill-opacity="1" text-anchor="start">Docker Compose</text><text x="408.0" y="167.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#9ca3af" fill-opacity="1" text-anchor="start">docker-compose.yml / compose.yaml services (registry-</text><text x="408.0" y="182.6" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#9ca3af" fill-opacity="1" text-anchor="start">and tag-aware): PostgreSQL, Redis, Kafka, RabbitMQ,</text><text x="408.0" y="198.3" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#9ca3af" fill-opacity="1" text-anchor="start">reverse proxy, Keycloak, MinIO…</text><rect x="744.0" y="122.0" width="336.0" height="118.0" rx="8" fill="#00e5a0" fill-opacity="0.07" stroke="#00e5a0" stroke-opacity="0.55" stroke-width="1.2"/><rect x="744.0" y="128.0" width="3.0" height="106.0" rx="1.5" fill="#00e5a0" fill-opacity="1" stroke="none" stroke-opacity="1" stroke-width="1"/><text x="760.0" y="146.3" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#e6edf3" fill-opacity="1" text-anchor="start">spec.md text</text><text x="760.0" y="167.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#9ca3af" fill-opacity="1" text-anchor="start">Epic titles, tasks and body; Spanish and English</text><text x="760.0" y="182.6" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#9ca3af" fill-opacity="1" text-anchor="start">keywords, accent-normalized → the system the project</text><text x="760.0" y="198.3" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#9ca3af" fill-opacity="1" text-anchor="start">will build</text><rect x="40.0" y="290.0" width="1040.0" height="84.0" rx="8" fill="#a78bfa" fill-opacity="0.07" stroke="#a78bfa" stroke-opacity="0.55" stroke-width="1.2"/><rect x="40.0" y="296.0" width="3.0" height="72.0" rx="1.5" fill="#a78bfa" fill-opacity="1" stroke="none" stroke-opacity="1" stroke-width="1"/><text x="56.0" y="314.4" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#e6edf3" fill-opacity="1" text-anchor="start">SystemArchitecture (pure, unit-tested)</text><text x="56.0" y="335.5" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#9ca3af" fill-opacity="1" text-anchor="start">systemNodesFromEvidence · composeServiceNodes · systemNodesFromSpecText → mergeSystemNodes: concrete detections beat generic ones, no duplicates, capped at 14</text><text x="56.0" y="351.8" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#9ca3af" fill-opacity="1" text-anchor="start">system nodes (+ up to 8 epic modules only for component types not already covered).</text><path d="M208.0,240.0 L208.0,290.0" fill="none" stroke="#9ca3af" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah-9ca3af)"/><path d="M560.0,240.0 L560.0,290.0" fill="none" stroke="#9ca3af" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah-9ca3af)"/><path d="M912.0,240.0 L912.0,290.0" fill="none" stroke="#9ca3af" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah-9ca3af)"/><rect x="40.0" y="412.0" width="1040.0" height="64.0" rx="8" fill="#f59e0b" fill-opacity="0.07" stroke="#f59e0b" stroke-opacity="0.55" stroke-width="1.2"/><rect x="40.0" y="418.0" width="3.0" height="52.0" rx="1.5" fill="#f59e0b" fill-opacity="1" stroke="none" stroke-opacity="1" stroke-width="1"/><text x="56.0" y="436.4" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#e6edf3" fill-opacity="1" text-anchor="start">Auto-wiring</text><text x="56.0" y="457.5" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#9ca3af" fill-opacity="1" text-anchor="start">client → main API / service (HTTP or via reverse proxy) · main → auth · database · cache · queue · epic modules → main entry point</text><path d="M560.0,374.0 L560.0,412.0" fill="none" stroke="#9ca3af" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah-9ca3af)"/><rect x="40.0" y="508.0" width="500.0" height="92.0" rx="8" fill="#00e5a0" fill-opacity="0.07" stroke="#00e5a0" stroke-opacity="0.55" stroke-width="1.2"/><rect x="40.0" y="514.0" width="3.0" height="80.0" rx="1.5" fill="#00e5a0" fill-opacity="1" stroke="none" stroke-opacity="1" stroke-width="1"/><text x="56.0" y="532.4" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#e6edf3" fill-opacity="1" text-anchor="start">S.arch = { nodes, edges }</text><text x="56.0" y="553.5" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#9ca3af" fill-opacity="1" text-anchor="start">The editable canvas. Drag, rename, connect, add from the palette. Toast</text><text x="56.0" y="569.8" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#9ca3af" fill-opacity="1" text-anchor="start">summary: “System: React SPA · Node/Express API · PostgreSQL …”</text><rect x="580.0" y="508.0" width="500.0" height="92.0" rx="8" fill="#3b82f6" fill-opacity="0.07" stroke="#3b82f6" stroke-opacity="0.55" stroke-width="1.2"/><rect x="580.0" y="514.0" width="3.0" height="80.0" rx="1.5" fill="#3b82f6" fill-opacity="1" stroke="none" stroke-opacity="1" stroke-width="1"/><text x="596.0" y="532.4" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#e6edf3" fill-opacity="1" text-anchor="start">C4 levels</text><text x="596.0" y="553.5" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#9ca3af" fill-opacity="1" text-anchor="start">Context · Container · Component tabs over the same model.</text><path d="M290.0,476.0 L290.0,508.0" fill="none" stroke="#9ca3af" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah-9ca3af)"/><path d="M830.0,476.0 L830.0,508.0" fill="none" stroke="#9ca3af" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah-9ca3af)"/><rect x="40.0" y="640.0" width="320.0" height="77.6" rx="8" fill="#22d3ee" fill-opacity="0.07" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="1.2"/><rect x="40.0" y="646.0" width="3.0" height="65.6" rx="1.5" fill="#22d3ee" fill-opacity="1" stroke="none" stroke-opacity="1" stroke-width="1"/><text x="56.0" y="664.4" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#e6edf3" fill-opacity="1" text-anchor="start">Persist</text><text x="56.0" y="685.5" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#9ca3af" fill-opacity="1" text-anchor="start">arch-save / arch-load ⇄ .alpaquitay/arch.json. “↻</text><text x="56.0" y="701.8" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#9ca3af" fill-opacity="1" text-anchor="start">Re-infer” regenerates.</text><path d="M200.0,600.0 L200.0,640.0" fill="none" stroke="#9ca3af" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah-9ca3af)"/><text x="400.0" y="664.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="700" fill="#e6edf3" fill-opacity="1" text-anchor="start">arch-export → infra/main.*</text><rect x="400.0" y="676.0" width="126.8" height="28.0" rx="14.0" fill="#0d1117" fill-opacity="1" stroke="none" stroke-opacity="1" stroke-width="1"/><rect x="400.0" y="676.0" width="126.8" height="28.0" rx="14.0" fill="#f59e0b" fill-opacity="0.14" stroke="#f59e0b" stroke-opacity="0.55" stroke-width="1"/><text x="410.0" y="694.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#e6edf3" fill-opacity="1" text-anchor="start">Terraform  .tf · AWS</text><rect x="534.8" y="676.0" width="92.2" height="28.0" rx="14.0" fill="#0d1117" fill-opacity="1" stroke="none" stroke-opacity="1" stroke-width="1"/><rect x="534.8" y="676.0" width="92.2" height="28.0" rx="14.0" fill="#f59e0b" fill-opacity="0.14" stroke="#f59e0b" stroke-opacity="0.55" stroke-width="1"/><text x="544.8" y="694.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#e6edf3" fill-opacity="1" text-anchor="start">AWS CDK  .ts</text><rect x="635.0" y="676.0" width="125.5" height="28.0" rx="14.0" fill="#0d1117" fill-opacity="1" stroke="none" stroke-opacity="1" stroke-width="1"/><rect x="635.0" y="676.0" width="125.5" height="28.0" rx="14.0" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-opacity="0.55" stroke-width="1"/><text x="645.0" y="694.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#e6edf3" fill-opacity="1" text-anchor="start">Azure Bicep  .bicep</text><rect x="768.5" y="676.0" width="80.3" height="28.0" rx="14.0" fill="#0d1117" fill-opacity="1" stroke="none" stroke-opacity="1" stroke-width="1"/><rect x="768.5" y="676.0" width="80.3" height="28.0" rx="14.0" fill="#ff4b6e" fil