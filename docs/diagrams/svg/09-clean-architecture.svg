<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 770" width="1120" height="770" role="img" aria-labelledby="t d"><title id="t">Clean Architecture in generated projects</title><desc id="d">ProjectBuilderSkill detects the stack, then applies the canonical layout. Dependencies only point inward.</desc><defs><marker id="ah-9ca3af" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#9ca3af"/></marker></defs><rect x="0.0" y="0.0" width="1120.0" height="770.0" rx="14" fill="#0d1117" fill-opacity="1" stroke="#30363d" stroke-opacity="1" stroke-width="1"/><rect x="0.0" y="0.0" width="1120.0" height="4.0" rx="0" fill="#00e5a0" fill-opacity="1" stroke="none" stroke-opacity="1" stroke-width="1"/><text x="40.0" y="40.0" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="11" font-weight="700" fill="#00e5a0" fill-opacity="1" text-anchor="start" letter-spacing="1.6">DESIGN · PROJECT GENERATION</text><text x="40.0" y="70.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="700" fill="#e6edf3" fill-opacity="1" text-anchor="start">Clean Architecture in generated projects</text><text x="40.0" y="94.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#9ca3af" fill-opacity="1" text-anchor="start">ProjectBuilderSkill detects the stack, then applies the canonical layout. Dependencies only point inward.</text><rect x="40.0" y="122.0" width="1040.0" height="77.6" rx="8" fill="#3b82f6" fill-opacity="0.07" stroke="#3b82f6" stroke-opacity="0.55" stroke-width="1.2"/><rect x="40.0" y="128.0" width="3.0" height="65.6" rx="1.5" fill="#3b82f6" fill-opacity="1" stroke="none" stroke-opacity="1" stroke-width="1"/><text x="56.0" y="146.3" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#e6edf3" fill-opacity="1" text-anchor="start">detectStyleFromGoal() → ArchitecturalStyle</text><text x="56.0" y="167.5" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#9ca3af" fill-opacity="1" text-anchor="start">Markers: pom.xml · build.gradle · package.json (react / next / vue / express / expo) · angular.json · *.csproj · go.mod · requirements.txt (django / flask) · pyproject.toml — or the</text><text x="56.0" y="183.8" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#9ca3af" fill-opacity="1" text-anchor="start">goal text (react-clean, spring-fullstack).</text><rect x="40.0" y="236.0" width="500.0" height="436.0" rx="12" fill="#f59e0b" fill-opacity="0.03" stroke="#f59e0b" stroke-opacity="0.45" stroke-width="1.2" stroke-dasharray="5 4"/><rect x="54.0" y="226.0" width="234.9" height="20.0" rx="10" fill="#0d1117" fill-opacity="1" stroke="#f59e0b" stroke-opacity="0.7" stroke-width="1.1"/><text x="64.0" y="240.0" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="10.5" font-weight="700" fill="#f59e0b" fill-opacity="1" text-anchor="start" letter-spacing="0.3">JAVA · SPRING · CLEAN ARCHITECTURE</text><rect x="292.9" y="228.0" width="101.7" height="16.0" rx="4" fill="#0d1117" fill-opacity="1" stroke="none" stroke-opacity="1" stroke-width="1"/><text x="298.9" y="240.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#9ca3af" fill-opacity="1" text-anchor="start">Robert C. Martin</text><rect x="60.0" y="268.0" width="460.0" height="84.0" rx="9" fill="#f59e0b" fill-opacity="0.09" stroke="#f59e0b" stroke-opacity="0.65" stroke-width="1.3"/><text x="76.0" y="294.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="700" fill="#e6edf3" fill-opacity="1" text-anchor="start">Infrastructure</text><text x="76.0" y="314.0" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="11" font-weight="400" fill="#e6edf3" fill-opacity="1" text-anchor="start">persistence/ · web/rest/ · config/</text><text x="76.0" y="334.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#9ca3af" fill-opacity="1" text-anchor="start">@Entity + Spring Data JPA · thin @RestController · security, CORS, Swagger</text><rect x="60.0" y="366.0" width="460.0" height="84.0" rx="9" fill="#3b82f6" fill-opacity="0.09" stroke="#3b82f6" stroke-opacity="0.65" stroke-width="1.3"/><text x="76.0" y="392.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="700" fill="#e6edf3" fill-opacity="1" text-anchor="start">Application</text><text x="76.0" y="412.0" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="11" font-weight="400" fill="#e6edf3" fill-opacity="1" text-anchor="start">service/ · dto/</text><text x="76.0" y="432.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#9ca3af" fill-opacity="1" text-anchor="start">Use cases (@Service) — no HTTP, no JPA</text><rect x="60.0" y="464.0" width="460.0" height="84.0" rx="9" fill="#00e5a0" fill-opacity="0.09" stroke="#00e5a0" stroke-opacity="0.65" stroke-width="1.3"/><text x="76.0" y="490.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="700" fill="#e6edf3" fill-opacity="1" text-anchor="start">Domain</text><text x="76.0" y="510.0" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="11" font-weight="400" fill="#e6edf3" fill-opacity="1" text-anchor="start">model/ · port/</text><text x="76.0" y="530.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#9ca3af" fill-opacity="1" text-anchor="start">Pure POJOs (no @Entity) and repository / service interfaces</text><rect x="60.0" y="562.0" width="460.0" height="84.0" rx="9" fill="#8b949e" fill-opacity="0.09" stroke="#8b949e" stroke-opacity="0.65" stroke-width="1.3"/><text x="76.0" y="588.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="700" fill="#e6edf3" fill-opacity="1" text-anchor="start">Shared</text><text x="76.0" y="608.0" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="11" font-weight="400" fill="#e6edf3" fill-opacity="1" text-anchor="start">exception/</text><text x="76.0" y="628.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#9ca3af" fill-opacity="1" text-anchor="start">@ControllerAdvice and custom errors</text><rect x="580.0" y="236.0" width="500.0" height="436.0" rx="12" fill="#f472b6" fill-opacity="0.03" stroke="#f472b6" stroke-opacity="0.45" stroke-width="1.2" stroke-dasharray="5 4"/><rect x="594.0" y="226.0" width="184.3" height="20.0" rx="10" fill="#0d1117" fill-opacity="1" stroke="#f472b6" stroke-opacity="0.7" stroke-width="1.1"/><text x="604.0" y="240.0" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="10.5" font-weight="700" fill="#f472b6" fill-opacity="1" text-anchor="start" letter-spacing="0.3">REACT · CLEAN ARCHITECTURE</text><rect x="782.3" y="228.0" width="118.8" height="16.0" rx="4" fill="#0d1117" fill-opacity="1" stroke="none" stroke-opacity="1" stroke-width="1"/><text x="788.3" y="240.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#9ca3af" fill-opacity="1" text-anchor="start">ISO/IEC/IEEE 12207</text><rect x="600.0" y="268.0" width="460.0" height="84.0" rx="9" fill="#f59e0b" fill-opacity="0.09" stroke="#f59e0b" stroke-opacity="0.65" stroke-width="1.3"/><text x="616.0" y="294.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="700" fill="#e6edf3" fill-opacity="1" text-anchor="start">Presentation</text><text x="616.0" y="314.0" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="11" font-weight="400" fill="#e6edf3" fill-opacity="1" text-anchor="start">components/ · pages/ · layout/</text><text x="616.0" y="334.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#9ca3af" fill-opacity="1" text-anchor="start">Reusable UI, route-level pages, layout wrappers</text><rect x="600.0" y="366.0" width="460.0" height="84.0" rx="9" fill="#f472b6" fill-opacity="0.09" stroke="#f472b6" stroke-opacity="0.65" stroke-width="1.3"/><text x="616.0" y="392.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="700" fill="#e6edf3" fill-opacity="1" text-anchor="start">Infrastructure</text><text x="616.0" y="412.0" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="11" font-weight="400" fill="#e6edf3" fill-opacity="1" text-anchor="start">api/ · storage/</text><text x="616.0" y="432.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#9ca3af" fill-opacity="1" text-anchor="start">Axios adapters (all HTTP lives here) · localStorage adapters</text><rect x="600.0" y="464.0" width="460.0" height="84.0" rx="9" fill="#3b82f6" fill-opacity="0.09" stroke="#3b82f6" stroke-opacity="0.65" stroke-width="1.3"/><text x="616.0" y="490.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="700" fill="#e6edf3" fill-opacity="1" text-anchor="start">Application</text><text x="616.0" y="510.0" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="11" font-weight="400" fill="#e6edf3" fill-opacity="1" text-anchor="start">use-case/ · store/</text><text x="616.0" y="530.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#9ca3af" fill-opacity="1" text-anchor="start">Business use cases · Zustand / Redux slices</text><rect x="600.0" y="562.0" width="460.0" height="84.0" rx="9" fill="#00e5a0" fill-opacity="0.09" stroke="#00e5a0" stroke-opacity="0.65" stroke-width="1.3"/><text x="616.0" y="588.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="700" fill="#e6edf3" fill-opacity="1" text-anchor="start">Domain</text><text x="616.0" y="608.0" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="11" font-weight="400" fill="#e6edf3" fill-opacity="1" text-anchor="start">model/ · service/</text><text x="616.0" y="628.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#9ca3af" fill-opacity="1" text-anchor="start">TypeScript types (no React, no axios) · pure domain logic</text><text x="40.0" y="702.0" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="12" font-weight="400" fill="#00e5a0" fill-opacity="1" text-anchor="start">Dependency rule:   infrastructure → application → domain      (the domain imports nothing from outside)</text><text x="40.0" y="724.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#9ca3af" fill-opacity="1" text-anchor="start">Java packages live under src/main/java/com/company/project/, React layers under src/.</text><path d="M450.0,199.6 L450.0,236.0" fill="none" stroke="#9ca3af" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah-9ca3af)"/><path d="M990.0,199.6 L990.0,236.0" fill="none" stroke="#9ca3af" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah-9ca3af)"/><text x="1080" y="754" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#6b7280" text-anchor="end">Alpaquitay AI · github.com/sergioide007/alpaquitay-ai</text></svg>